apiVersion: v1
kind: Service
metadata:
  name: postgres-db-svc
  namespace: {{ .Values.namespace }}
  labels:
    app: postgres-db
    {{- include "student-app.labels" . | nindent 4 }}
spec:
  # Headless service: each StatefulSet pod gets its own stable DNS entry
  clusterIP: None
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: postgres-db
