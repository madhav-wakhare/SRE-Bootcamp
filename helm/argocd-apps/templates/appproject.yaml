# The project every Application below belongs to. It fences GitOps in: only this
# repository may be used as a source, and only these namespaces deployed into.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: {{ .Values.project }}
  labels:
    app.kubernetes.io/name: argocd-apps
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  description: Student REST API stack, deployed from the Helm charts in this repository
  sourceRepos:
    - {{ .Values.repoURL | quote }}
  destinations:
    {{- range .Values.namespaces }}
    - server: https://kubernetes.default.svc
      namespace: {{ . | quote }}
    {{- end }}
  # This stack creates cluster-scoped objects too: Namespaces, the ESO CRDs,
  # ClusterRoles, and the ClusterSecretStore.
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
