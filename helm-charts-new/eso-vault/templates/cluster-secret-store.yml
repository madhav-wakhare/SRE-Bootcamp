# ClusterSecretStore: cluster-scoped store that allows ExternalSecrets in any
# namespace to pull secrets from HashiCorp Vault using Kubernetes auth.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Release.Name }}-{{ .Values.clusterSecretStore.name }}
  labels:
    {{- include "eso-vault.labels" . | nindent 4 }}
spec:
  provider:
    vault:
      server: {{ .Values.clusterSecretStore.vaultServer | quote }}
      path: {{ .Values.clusterSecretStore.vaultPath | quote }}
      version: {{ .Values.clusterSecretStore.vaultVersion | quote }}
      auth:
        kubernetes:
          mountPath: {{ .Values.clusterSecretStore.mountPath | quote }}
          role: {{ .Values.clusterSecretStore.role | quote }}
          serviceAccountRef:
            name: {{ .Values.clusterSecretStore.esoServiceAccount.name | quote }}
            namespace: {{ .Values.clusterSecretStore.esoServiceAccount.namespace | quote }}
