apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  labels:
    app.kubernetes.io/name: student-api
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  # Every key under `config:` in values.yaml becomes an entry here.
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
