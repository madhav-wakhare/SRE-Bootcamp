apiVersion: v1
kind: ServiceAccount
metadata:
  # Provides a Kubernetes identity for Vault pods; used by the Vault
  # Kubernetes auth method to validate token reviews via the K8s API.
  name: {{ .Values.vault.serviceAccountName }}
  namespace: {{ .Values.namespace }}
  labels:
    app: vault
    {{- include "eso-vault.labels" . | nindent 4 }}
