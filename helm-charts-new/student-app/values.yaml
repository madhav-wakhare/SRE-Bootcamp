# student-app — values.yaml
# Release name: backend

# Namespace
namespace: student-app

# Student API (application)
studentApi:
  image:
    repository: wakharemadhav/sre-student-api
    tag: "bd10dca"
    pullPolicy: IfNotPresent

  replicaCount: 1

  port: 5000

  # nodeSelector label for the application nodes
  nodeSelector:
    type: application

  resources:
    requests:
      cpu: "200m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

  initContainer:
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "250m"
        memory: "256Mi"

  # Service configuration — exposed as NodePort for external access
  service:
    type: NodePort
    port: 5000
    targetPort: 5000
    nodePort: 30083

  # Config values passed as a ConfigMap (non-sensitive)
  config:
    PORT: "5000"
    LOG_FILE: "/app/logs/app.log"

  # ImagePullSecret name (created by ESO from Vault)
  imagePullSecret: dockerhub-secret

  # Secret name containing DATABASE_URL (created by ESO from Vault)
  dbUrlSecret: student-db-url-secret

# PostgreSQL Database (StatefulSet)
postgresDb:
  image:
    repository: postgres
    tag: "17-alpine"
    pullPolicy: IfNotPresent

  # nodeSelector label for the database nodes
  nodeSelector:
    type: database

  storageClass: standard
  storageSize: 1Gi

  resources:
    requests:
      cpu: "200m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

  # Config values (non-sensitive)
  config:
    POSTGRES_USER: "postgres"
    POSTGRES_DB: "students_db"

  # Secret name containing POSTGRES_PASSWORD (created by ESO from Vault)
  dbSecret: postgres-db-secret

# External Secrets — synced from Vault via ClusterSecretStore
externalSecrets:
  refreshInterval: "1m"

  # ClusterSecretStore name — must match: <eso-vault release name>-<store name>
  # e.g. release ev + vault-one2n-store = ev-vault-one2n-store
  secretStoreName: ev-vault-one2n-store

  # Vault KV path for all application secrets
  vaultPath: one2n/dev/app-config

  # Individual secret targets
  dbUrl:
    targetSecret: student-db-url-secret
    property: db_url

  dbPassword:
    targetSecret: postgres-db-secret
    property: db_password

  dockerhub:
    targetSecret: dockerhub-secret
    property: dockerconfigjson
