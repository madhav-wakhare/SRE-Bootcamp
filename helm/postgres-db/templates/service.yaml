apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: postgres-db
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  # Headless (clusterIP: None): gives the StatefulSet pod a stable DNS name and
  # skips the load balancer, which is what a single database wants.
  clusterIP: None
  ports:
    - name: postgres
      port: {{ .Values.service.port }}
      targetPort: postgres
      protocol: TCP
  selector:
    app.kubernetes.io/name: postgres-db
    app.kubernetes.io/instance: {{ .Release.Name }}
