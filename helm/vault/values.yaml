# Values for the vault chart.
#
# Install with:
#   helm upgrade --install vault ./helm/vault -n vault --create-namespace
#
# Use the release name "vault": the eso-config chart points at
# http://vault.vault.svc.cluster.local:8200, which is built from that name.

image:
  repository: hashicorp/vault
  tag: "2.0.3"
  pullPolicy: IfNotPresent

replicaCount: 1

# Run Vault on the node labelled type=dependent_services.
nodeSelector:
  type: dependent_services

ports:
  api: 8200
  cluster: 8201

service:
  type: ClusterIP
  port: 8200

# Disk for Vault's Raft storage. Losing this PVC loses every stored secret.
persistence:
  storageClass: standard
  size: 1Gi
  accessMode: ReadWriteOnce
  mountPath: /vault/data

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

readinessProbe:
  initialDelaySeconds: 5
  periodSeconds: 5

# Vault runs as uid 100 / gid 1000. fsGroup makes the Raft volume writable, and
# the initContainer chowns it on a freshly created volume.
fsGroup: 1000
initContainerImage: busybox:1.36
