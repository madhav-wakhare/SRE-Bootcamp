{{- if .Values.externalSecrets.enabled }}
{{/*
Pulls db_url out of Vault and materialises it as a Secret key named
DATABASE_URL, which is what the Flask app and Alembic both read.
*/}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "student-api.fullname" . }}-db-url
  labels:
    {{- include "student-api.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStore }}
    kind: ClusterSecretStore
  target:
    name: {{ include "student-api.dbSecretName" . }}
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKey }}
        property: {{ .Values.externalSecrets.databaseUrl.remoteProperty }}
{{- if .Values.imagePullSecret.enabled }}
---
{{/*
Rewrites the raw JSON stored in Vault into a kubernetes.io/dockerconfigjson
Secret. The doubled braces are ESO's own templating, escaped so Helm passes
them through untouched.
*/}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "student-api.fullname" . }}-registry
  labels:
    {{- include "student-api.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStore }}
    kind: ClusterSecretStore
  target:
    name: {{ include "student-api.registrySecretName" . }}
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: "{{ `{{ .dockerconfigjson }}` }}"
  data:
    - secretKey: dockerconfigjson
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKey }}
        property: {{ .Values.imagePullSecret.remoteProperty }}
{{- end }}
{{- end }}
