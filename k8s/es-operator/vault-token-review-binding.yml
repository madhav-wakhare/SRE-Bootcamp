apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vault-token-review
  labels:
    app: vault
    component: auth
subjects:
- kind: ServiceAccount
  name: vault-sa          
  namespace: vault-ns     
roleRef:
  kind: ClusterRole
  name: vault-token-review  
  apiGroup: rbac.authorization.k8s.io