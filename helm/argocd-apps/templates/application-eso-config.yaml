# Wave 2 — the ClusterSecretStore pointing ESO at Vault. It reports NotReady
# until Vault is unsealed and configured, which does not block the sync.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eso-config
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.project }}
  source:
    repoURL: {{ .Values.repoURL | quote }}
    targetRevision: {{ .Values.targetRevision | quote }}
    path: helm/eso-config
    helm:
      releaseName: eso-config
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: eso-ns
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
