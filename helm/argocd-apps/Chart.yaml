apiVersion: v2
name: argocd-apps
description: >-
  Declarative Argo CD configuration for this repository — the AppProject, the
  git repository registration, and one Application per Helm chart under helm/.
  Installed once to bootstrap GitOps; from then on Argo CD keeps it in sync with
  git through its own root Application.
type: application
