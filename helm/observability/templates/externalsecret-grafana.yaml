# Tells External Secrets Operator to read Grafana's admin credentials out of
# Vault. The Grafana subchart is pointed at this Secret through
# `grafana.admin.existingSecret`, so no password is written into this chart.
#
# The alternative — letting the chart generate a random password — regenerates
# the value on every render, which Argo CD would report as permanent drift.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.externalSecret.grafana.secretName }}
  labels:
    app.kubernetes.io/name: observability
    app.kubernetes.io/component: grafana
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStore }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.externalSecret.grafana.secretName }}
    creationPolicy: Owner
  # The key names must match grafana.admin.userKey / passwordKey in values.yaml.
  data:
    - secretKey: admin-user
      remoteRef:
        key: {{ .Values.externalSecret.remoteKey }}
        property: {{ .Values.externalSecret.grafana.remoteUserProperty }}
    - secretKey: admin-password
      remoteRef:
        key: {{ .Values.externalSecret.remoteKey }}
        property: {{ .Values.externalSecret.grafana.remotePasswordProperty }}
