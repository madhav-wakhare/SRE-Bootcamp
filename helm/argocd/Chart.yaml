apiVersion: v2
name: argocd
description: >-
  Wrapper around the community Argo CD chart. The upstream chart is vendored
  into charts/ so the GitOps controller itself can be installed from this
  repository without reaching out to an external Helm repo at deploy time.
type: application
version: 1.0.0
appVersion: "v3.4.6"
maintainers:
  - name: madhav-wakhare
keywords:
  - argocd
  - gitops
  - continuous-delivery
dependencies:
  - name: argo-cd
    version: 10.2.2
    repository: https://argoproj.github.io/argo-helm
