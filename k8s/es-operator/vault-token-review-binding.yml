apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vault-token-review
  labels:
    app: vault
    component: auth
subjects:
- kind: ServiceAccount
  name: vault-sa          # Your Vault service account
  namespace: vault-ns     # Where Vault runs
roleRef:
  kind: ClusterRole
  name: vault-token-review  # References the ClusterRole above
  apiGroup: rbac.authorization.k8s.io