{{/*
Two services, following the standard StatefulSet pattern:
  * <fullname>          — ClusterIP, the address clients (ESO) talk to.
  * <fullname>-headless — governs the StatefulSet and gives each pod stable DNS.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vault.fullname" . }}
  labels:
    {{- include "vault.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: api
      protocol: TCP
  selector:
    {{- include "vault.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vault.headlessServiceName" . }}
  labels:
    {{- include "vault.labels" . | nindent 4 }}
spec:
  clusterIP: None
  # Resolve pods before they are ready so Raft peers can find each other.
  publishNotReadyAddresses: true
  ports:
    - name: http
      port: {{ .Values.ports.api }}
      targetPort: api
      protocol: TCP
    - name: cluster
      port: {{ .Values.ports.cluster }}
      targetPort: cluster
      protocol: TCP
  selector:
    {{- include "vault.selectorLabels" . | nindent 4 }}
