# -----------------------------------------------------------------------------
# helm/eso-config — default values
#
# Install with:
#   helm upgrade --install eso-config ./helm/eso-config -n eso-ns
#
# Requires: the external-secrets release (CRDs + operator) and an unsealed Vault.
# -----------------------------------------------------------------------------

nameOverride: ""
fullnameOverride: ""

clusterSecretStore:
  create: true

  # A ClusterSecretStore is cluster scoped and every ExternalSecret in the
  # cluster refers to it by this exact name, so it is a fixed, well known name
  # rather than a release-prefixed one. The postgres-db and student-api charts
  # default to the same value (see their `externalSecrets.secretStore` key) —
  # change it here and you must change it there too.
  name: vault-backend

  vault:
    # Must match: http://<vault fullname>.<vault namespace>.svc.cluster.local:8200
    server: http://vault.vault.svc.cluster.local:8200
    # Mount path of the KV engine inside Vault.
    path: secret
    version: v2
    auth:
      kubernetes:
        # Auth method mount path inside Vault ("vault auth enable kubernetes").
        mountPath: kubernetes
        # Vault role bound to ESO's ServiceAccount ("make vault-configure").
        role: eso-role
        # ESO's own ServiceAccount — Vault validates this token via TokenReview.
        serviceAccountRef:
          name: external-secrets
          namespace: eso-ns
