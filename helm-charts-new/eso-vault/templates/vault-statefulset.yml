apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vault-statefulset
  namespace: {{ .Values.namespace }}
  labels:
    app: vault
    {{- include "eso-vault.labels" . | nindent 4 }}
spec:
  serviceName: {{ .Values.vault.service.name }}
  replicas: {{ .Values.vault.replicaCount }}
  selector:
    matchLabels:
      app: vault
  template:
    metadata:
      labels:
        app: vault
    spec:
      serviceAccountName: {{ .Values.vault.serviceAccountName }}
      nodeSelector:
        {{- toYaml .Values.vault.nodeSelector | nindent 8 }}
      securityContext:
        fsGroup: 1000
      # Fix /vault/data directory ownership before the main container starts
      initContainers:
        - name: fix-permissions
          image: busybox
          securityContext:
            runAsUser: 0
          command:
            - sh
            - -c
            - |
              mkdir -p /vault/data
              chown -R 100:1000 /vault/data
          volumeMounts:
            - name: vault-data
              mountPath: /vault/data
      containers:
        - name: vault
          image: "{{ .Values.vault.image.repository }}:{{ .Values.vault.image.tag }}"
          imagePullPolicy: {{ .Values.vault.image.pullPolicy }}
          securityContext:
            capabilities:
              add: ["IPC_LOCK"]
          command: ["vault"]
          args: ["server", "-config=/vault/config/vault.hcl"]
          ports:
            - name: api
              containerPort: {{ .Values.vault.ports.api }}
            - name: cluster
              containerPort: {{ .Values.vault.ports.cluster }}
          env:
            - name: VAULT_ADDR
              value: "http://127.0.0.1:{{ .Values.vault.ports.api }}"
          readinessProbe:
            httpGet:
              path: /v1/sys/health
              port: {{ .Values.vault.ports.api }}
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: vault-config
              mountPath: /vault/config
            - name: vault-data
              mountPath: /vault/data
          resources:
            {{- toYaml .Values.vault.resources | nindent 12 }}
      volumes:
        - name: vault-config
          configMap:
            name: vault-config
  volumeClaimTemplates:
    - metadata:
        name: vault-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.vault.storageClass | quote }}
        resources:
          requests:
            storage: {{ .Values.vault.storageSize }}
