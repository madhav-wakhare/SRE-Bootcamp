# Values for the student-api chart.
#
# Install with:
#   helm upgrade --install student-api ./helm/student-api -n student-api --create-namespace
#
# Use the release name "student-api": every resource in this chart is named
# after the release, and the other charts expect those names.

replicaCount: 1

image:
  repository: wakharemadhav/sre-student-api
  # THIS LINE IS WRITTEN BY CI. The "update-image-tag" job rewrites it to the
  # commit SHA it just pushed to Docker Hub (`make helm-set-image-tag`), and
  # Argo CD deploys whatever it finds here.
  tag: "c5c424f"
  pullPolicy: IfNotPresent

# Run the API on the node labelled type=application.
nodeSelector:
  type: application

# Port the Flask app listens on inside the container.
containerPort: 5000

service:
  type: NodePort
  port: 5000
  # Fixed, so the API keeps the same URL across reinstalls.
  nodePort: 30080

# Non-secret settings. These become a ConfigMap the pod reads with envFrom.
config:
  PORT: "5000"
  LOG_FILE: /app/logs/app.log

# Alembic runs to completion in an initContainer before the app container
# starts, so the app never serves traffic against an out-of-date schema.
migrationCommand: ["python", "src/migrations/apply_migrations.py"]
migrationResources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

# DATABASE_URL is never stored in this chart. External Secrets Operator reads it
# from Vault and writes it into the Secret "student-api-db-url", which the pod
# then reads.
externalSecret:
  # The ClusterSecretStore created by the eso-config chart.
  secretStore: vault-backend
  # KV path in Vault holding the application secrets.
  remoteKey: one2n/dev/app-config
  # Field inside that path holding the SQLAlchemy connection string.
  remoteProperty: db_url
  refreshInterval: 1m

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  path: /healthcheck
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 10
  liveness:
    initialDelaySeconds: 15
    periodSeconds: 20
