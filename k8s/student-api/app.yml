apiVersion: v1
kind: ConfigMap
metadata:
  name: student-api-config
  namespace: student-api
data:
  PORT: "5000"
  LOG_FILE: "/app/logs/app.log"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: student-api-external-secret
  namespace: student-api
spec:
  refreshInterval: "1m"
  secretStoreRef:
    name: vault-one2n-store
    kind: ClusterSecretStore
  target:
    name: student-db-url-secret # Create a Kubernetes secret named "student-db-url-secret" in the "student-api" namespace
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL # Create k8s secret key named "DATABASE_URL" in the "student-db-url-secret" secret
      remoteRef:
        key: one2n/dev/app-config # Fetch the secret from Vault at the path "one2n/dev/app-config"
        property: db_url # Fetch the value of the "DATABASE_URL" property from the dev secret in Vault
---
apiVersion: v1
kind: Secret
metadata:
  name: dockerhub-secret
  namespace: student-api
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: 
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-api
  namespace: student-api
  labels:
    app: student-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: student-api
  template:
    metadata:
      labels:
        app: student-api
    spec:
      imagePullSecrets:
        - name: dockerhub-secret
      # Ensure the API pod is scheduled only on Node A (Application node)
      nodeSelector:
        type: application
      initContainers:
        - name: run-migrations
          image: wakharemadhav/sre-student-api:1c5caf7
          command: ["alembic", "upgrade", "head"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: student-db-url-secret
                  key: DATABASE_URL
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
      containers:
        - name: student-api
          image: wakharemadhav/sre-student-api:1c5caf7
          ports:
            - containerPort: 5000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: student-db-url-secret
                  key: DATABASE_URL
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: student-api-config
                  key: PORT
            - name: LOG_FILE
              valueFrom:
                configMapKeyRef:
                  name: student-api-config
                  key: LOG_FILE
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace # Used Downward API to get the namespace of the pod
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            # Define resource requests and limits for the each container to ensure efficient resource allocation and prevent resource contention.
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: student-api-service
  namespace: student-api
spec:
  type: NodePort
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30080
  selector:
    app: student-api
