# External Secrets Operator (ESO) ExternalSecrets Manifests
# These ExternalSecret manifests synchronize credentials and connection strings
# from HashiCorp Vault into Kubernetes secrets within the 'student-api' namespace:
#   1. student-api-external-secret: Syncs DATABASE_URL into 'student-db-url-secret'
#   2. postgres-db-external-secret: Syncs POSTGRES_PASSWORD into 'postgres-db-secret'
#   3. dockerhub-external-secret: Syncs dockerconfigjson into 'dockerhub-secret' (type: dockerconfigjson)

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: student-api-external-secret
  namespace: student-api
spec:
  refreshInterval: "1m"
  secretStoreRef:
    name: vault-one2n-store
    kind: ClusterSecretStore
  target:
    name: student-db-url-secret
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: one2n/dev/app-config
        property: db_url
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-db-external-secret
  namespace: student-api
spec:
  refreshInterval: "1m"
  secretStoreRef:
    name: vault-one2n-store
    kind: ClusterSecretStore
  target:
    name: postgres-db-secret
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: one2n/dev/app-config
        property: db_password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dockerhub-external-secret
  namespace: student-api
spec:
  refreshInterval: "1m"
  secretStoreRef:
    name: vault-one2n-store
    kind: ClusterSecretStore
  target:
    name: dockerhub-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: "{{ .dockerconfigjson }}"
  data:
    - secretKey: dockerconfigjson
      remoteRef:
        key: one2n/dev/app-config
        property: dockerconfigjson
