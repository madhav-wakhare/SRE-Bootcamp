[project]
name = "sre-student-api"
version = "1.0.0"
description = "Student CRUD REST API for SRE Bootcamp"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Flask>=3.0.3",
    "Flask-SQLAlchemy>=3.1.1",
    "psycopg2-binary>=2.9.9",
    "python-dotenv>=1.0.1",
    "alembic>=1.13.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
]
