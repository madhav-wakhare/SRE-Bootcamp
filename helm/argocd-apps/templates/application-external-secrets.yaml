# Wave 0 — the operator and its CRDs. Nothing that creates an ExternalSecret or
# a ClusterSecretStore can sync before this is in place.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  # Deleting this Application also deletes what it created, instead of leaving
  # the resources behind with nothing managing them.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.project }}
  source:
    repoURL: {{ .Values.repoURL | quote }}
    targetRevision: {{ .Values.targetRevision | quote }}
    path: helm/external-secrets
    helm:
      # Same release name Helm used, so the resource names do not change.
      releaseName: external-secrets
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: eso-ns
  syncPolicy:
    automated:
      prune: true      # delete resources removed from git
      selfHeal: true   # undo changes made with kubectl
    syncOptions:
      - CreateNamespace=true
      # Server-side apply: the ESO CRDs are too large for the annotation a
      # client-side apply writes.
      - ServerSideApply=true
  # ESO's cert-controller injects a CA bundle into its own webhooks and CRDs at
  # runtime. That value is not in git, so without this the Application would
  # never leave OutOfSync.
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jqPathExpressions:
        - .spec.conversion.webhook.clientConfig.caBundle
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
