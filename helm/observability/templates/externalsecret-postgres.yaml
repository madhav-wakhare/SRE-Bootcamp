# Tells External Secrets Operator to read db_password out of Vault and store it
# in a Kubernetes Secret under the key DB_PASSWORD. postgres-exporter reads that
# Secret to build its connection string, so no database password is ever written
# into this chart.
#
# This is the same pattern the postgres-db and student-api charts use. The
# Secret has to live in THIS namespace: Secrets are namespaced, so the one ESO
# already creates in student-api cannot be read from here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.externalSecret.postgresExporter.secretName }}
  labels:
    app.kubernetes.io/name: observability
    app.kubernetes.io/component: postgres-exporter
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStore }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.externalSecret.postgresExporter.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecret.remoteKey }}
        property: {{ .Values.externalSecret.postgresExporter.remoteProperty }}
