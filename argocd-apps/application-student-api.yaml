---
# Wave 4 — the REST API. This is the one CI touches: the "update-image-tag" job
# rewrites image.tag in helm/student-api/values.yaml, and Argo CD rolls the new
# image out from that commit.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: student-api
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: sre-bootcamp
  source:
    repoURL: https://github.com/madhav-wakhare/SRE-Bootcamp.git
    targetRevision: main
    path: helm/student-api
    helm:
      releaseName: student-api
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: student-api
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
