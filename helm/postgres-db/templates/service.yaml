apiVersion: v1
kind: Service
metadata:
  name: {{ include "postgres-db.fullname" . }}
  labels:
    {{- include "postgres-db.labels" . | nindent 4 }}
spec:
  {{- if .Values.service.headless }}
  # Headless service: gives the StatefulSet pod a stable DNS name and skips the
  # kube-proxy load balancer, which is what you want for a single database.
  clusterIP: None
  {{- end }}
  ports:
    - name: postgres
      port: {{ .Values.service.port }}
      targetPort: postgres
      protocol: TCP
  selector:
    {{- include "postgres-db.selectorLabels" . | nindent 4 }}
