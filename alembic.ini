# Alembic Configuration File
# ------------------------------------------------------------------------------
# Alembic is the standard database migration tool for SQLAlchemy in Python.
# This configuration file specifies migration script locations, logging settings,
# and database connection options.

[alembic]
# Path to migration environment directory containing env.py and version scripts
script_location = src/migrations

# Template used to generate new migration files when running 'alembic revision'
file_template = %%(rev)s_%%(slug)s

# Prepend sys.path with the project root directory so migration scripts can import application modules
prepend_sys_path = .

# Default database URL (overridden dynamically in env.py via DATABASE_URL environment variable)
sqlalchemy.url = postgresql://postgres:postgres@localhost:5432/students_db

# Set encoding for migration files
output_encoding = utf-8

# Logging Configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
