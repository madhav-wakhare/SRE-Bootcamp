# Tells External Secrets Operator to read db_url out of Vault and store it in a
# Kubernetes Secret named <release>-db-url, under the key DATABASE_URL. That is
# the Secret the Deployment reads. No password is ever written in this chart.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-db-url
  labels:
    app.kubernetes.io/name: student-api
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStore }}
    kind: ClusterSecretStore
  target:
    name: {{ .Release.Name }}-db-url
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: {{ .Values.externalSecret.remoteKey }}
        property: {{ .Values.externalSecret.remoteProperty }}
