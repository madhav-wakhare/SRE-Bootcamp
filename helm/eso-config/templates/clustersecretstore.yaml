# One cluster-scoped store, so an ExternalSecret in any namespace can pull
# secrets from Vault without each namespace needing its own credentials.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.name }}
  labels:
    app.kubernetes.io/name: eso-config
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  provider:
    vault:
      server: {{ .Values.vault.server | quote }}
      path: {{ .Values.vault.path | quote }}
      version: {{ .Values.vault.version | quote }}
      auth:
        # ESO presents its ServiceAccount token; Vault checks it with the
        # TokenReview API and hands back a Vault token for the role below.
        kubernetes:
          mountPath: {{ .Values.vault.authMountPath | quote }}
          role: {{ .Values.vault.role | quote }}
          serviceAccountRef:
            name: {{ .Values.vault.serviceAccount.name | quote }}
            namespace: {{ .Values.vault.serviceAccount.namespace | quote }}
