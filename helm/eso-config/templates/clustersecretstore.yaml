{{- if .Values.clusterSecretStore.create }}
{{/*
Cluster scoped store, so an ExternalSecret in any namespace can pull secrets
from Vault without each namespace needing its own credentials.
*/}}
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.clusterSecretStore.name }}
  labels:
    {{- include "eso-config.labels" . | nindent 4 }}
spec:
  provider:
    vault:
      server: {{ .Values.clusterSecretStore.vault.server | quote }}
      path: {{ .Values.clusterSecretStore.vault.path | quote }}
      version: {{ .Values.clusterSecretStore.vault.version | quote }}
      auth:
        kubernetes:
          mountPath: {{ .Values.clusterSecretStore.vault.auth.kubernetes.mountPath | quote }}
          role: {{ .Values.clusterSecretStore.vault.auth.kubernetes.role | quote }}
          serviceAccountRef:
            name: {{ .Values.clusterSecretStore.vault.auth.kubernetes.serviceAccountRef.name | quote }}
            namespace: {{ .Values.clusterSecretStore.vault.auth.kubernetes.serviceAccountRef.namespace | quote }}
{{- end }}
