{{- if .Values.externalSecrets.enabled }}
{{/*
Pulls db_password out of Vault and materialises it as a Secret key named
POSTGRES_PASSWORD, which is what the Postgres image expects.
*/}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "postgres-db.fullname" . }}
  labels:
    {{- include "postgres-db.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStore }}
    kind: ClusterSecretStore
  target:
    name: {{ include "postgres-db.secretName" . }}
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKey }}
        property: {{ .Values.externalSecrets.remoteProperty }}
{{- end }}
