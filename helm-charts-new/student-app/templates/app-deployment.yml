apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-api-deployment
  namespace: {{ .Values.namespace }}
  labels:
    app: student-api
    {{- include "student-app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.studentApi.replicaCount }}
  selector:
    matchLabels:
      app: student-api
  template:
    metadata:
      labels:
        app: student-api
    spec:
      imagePullSecrets:
        - name: {{ .Values.studentApi.imagePullSecret }}
      nodeSelector:
        {{- toYaml .Values.studentApi.nodeSelector | nindent 8 }}
      # Run database migrations before the main application starts
      initContainers:
        - name: run-migrations
          image: "{{ .Values.studentApi.image.repository }}:{{ .Values.studentApi.image.tag }}"
          imagePullPolicy: {{ .Values.studentApi.image.pullPolicy }}
          command: ["python", "src/migrations/apply_migrations.py"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.studentApi.dbUrlSecret }}
                  key: DATABASE_URL
          resources:
            {{- toYaml .Values.studentApi.initContainer.resources | nindent 12 }}
      containers:
        - name: student-api
          image: "{{ .Values.studentApi.image.repository }}:{{ .Values.studentApi.image.tag }}"
          imagePullPolicy: {{ .Values.studentApi.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.studentApi.port }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.studentApi.dbUrlSecret }}
                  key: DATABASE_URL
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: student-api-config
                  key: PORT
            - name: LOG_FILE
              valueFrom:
                configMapKeyRef:
                  name: student-api-config
                  key: LOG_FILE
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: {{ .Values.studentApi.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: {{ .Values.studentApi.port }}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.studentApi.resources | nindent 12 }}
